name: CI
on:
  push:
    branches: ["**"]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Stockfish 18
        run: |
          mkdir -p bin .cache
          curl -fL -o .cache/sf.tar https://github.com/official-stockfish/Stockfish/releases/download/sf_18/stockfish-ubuntu-x86-64-avx2.tar
          tar -xf .cache/sf.tar -C .cache
          cp .cache/stockfish/stockfish-ubuntu-x86-64-avx2 bin/stockfish && chmod 755 bin/stockfish
      - run: npm test
      - name: Interface tests (Spanish, English, 2.1 features)
        run: sudo apt-get install -y xvfb >/dev/null && npm run test:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: ui-linux, path: "test/ui/out/*.txt\ntest/ui/out/shots", retention-days: 14 }

  mac:
    name: Build and test (macOS, Apple Silicon)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - name: Package the app
        run: npm run package:mac
      - name: Test the packaged app on macOS
        run: bash scripts/test-mac.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: mac-test, path: "test/ui/out-mac", retention-days: 14 }
      - uses: actions/upload-artifact@v4
        with: { name: Analysis-Board-mac, path: "dist/Analysis-Board-*-mac.zip", retention-days: 30 }
